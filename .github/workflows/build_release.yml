name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 v1.0.1)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller Pillow

      - name: Set version
        run: |
          if ("${{ github.event_name }}" -eq "push") {
            $ver = "${{ github.ref_name }}"
          } else {
            $ver = "${{ github.event.inputs.version }}"
          }
          echo "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8
          echo $ver | Out-File -FilePath version.txt -Encoding utf8 -NoNewline

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller `
            --name=LaborLawApp `
            --onedir `
            --noconsole `
            --noconfirm `
            --clean `
            --add-data="data;data" `
            --add-data="vectorstore.pkl;." `
            --add-data="chunks_cache.jsonl;." `
            --add-data="users.json;." `
            --add-data="version.txt;." `
            --add-data="simhei.ttf;." `
            --add-data="UI 图片;UI 图片" `
            --add-data="gui_app.py;." `
            --add-data="backend.py;." `
            --add-data="simple_vectorstore.py;." `
            --add-data="scan_data_directory_func.py;." `
            --add-data="build_db.py;." `
            --hidden-import=tkinter `
            --hidden-import=PIL `
            --hidden-import=PIL.Image `
            --hidden-import=PIL.ImageTk `
            --hidden-import=langchain `
            --hidden-import=langgraph `
            --hidden-import=langchain_openai `
            --hidden-import=langchain_community `
            --hidden-import=langchain_core `
            --hidden-import=langchain_text_splitters `
            --hidden-import=simple_vectorstore `
            --hidden-import=scan_data_directory_func `
            --hidden-import=backend `
            --hidden-import=dotenv `
            --hidden-import=reportlab `
            --hidden-import=docx `
            --hidden-import=numpy `
            --hidden-import=requests `
            --hidden-import=pymupdf `
            --hidden-import=json `
            --hidden-import=hashlib `
            --hidden-import=uuid `
            --hidden-import=re `
            --hidden-import=queue `
            --hidden-import=threading `
            --hidden-import=urllib `
            --hidden-import=tempfile `
            --distpath=dist `
            main.py

      - name: Install NSIS
        run: choco install nsis -y

      - name: Create installer with NSIS
        run: |
          $version = $env:VERSION -replace '^v', ''
          @"
          !define PRODUCT_NAME "劳动法律师智能助理"
          !define PRODUCT_NAME_EN "LaborLawAssistant"
          !define PRODUCT_VERSION "$version"
          !define PRODUCT_PUBLISHER "LaborLaw AI Team"

          OutFile "dist\LaborLawAssistant_Setup_`$env:VERSION.exe"
          InstallDir "`$PROGRAMFILES\`${PRODUCT_NAME_EN}"
          RequestExecutionLevel admin
          SetCompressor /SOLID lzma
          SetCompressorDictSize 64

          !include "MUI2.nsh"
          !define MUI_ABORTWARNING
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "SimpChinese"

          Section "Install"
              SetOutPath "`$INSTDIR"
              File /r "dist\LaborLawApp\*.*"
              CreateDirectory "`$SMPROGRAMS\`${PRODUCT_NAME}"
              CreateShortCut "`$SMPROGRAMS\`${PRODUCT_NAME}\`${PRODUCT_NAME}.lnk" "`$INSTDIR\LaborLawApp.exe"
              CreateShortCut "`$SMPROGRAMS\`${PRODUCT_NAME}\卸载 `${PRODUCT_NAME}.lnk" "`$INSTDIR\uninst.exe"
              CreateShortCut "`$DESKTOP\`${PRODUCT_NAME}.lnk" "`$INSTDIR\LaborLawApp.exe"
              WriteUninstaller "`$INSTDIR\uninst.exe"
              WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${PRODUCT_NAME_EN}" "DisplayName" "`${PRODUCT_NAME}"
              WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${PRODUCT_NAME_EN}" "UninstallString" "`$INSTDIR\uninst.exe"
              WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${PRODUCT_NAME_EN}" "DisplayVersion" "`${PRODUCT_VERSION}"
              WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${PRODUCT_NAME_EN}" "Publisher" "`${PRODUCT_PUBLISHER}"
              WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${PRODUCT_NAME_EN}" "NoModify" 1
              WriteRegDWORD HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${PRODUCT_NAME_EN}" "NoRepair" 1
          SectionEnd

          Section "Uninstall"
              Delete "`$SMPROGRAMS\`${PRODUCT_NAME}\`${PRODUCT_NAME}.lnk"
              Delete "`$SMPROGRAMS\`${PRODUCT_NAME}\卸载 `${PRODUCT_NAME}.lnk"
              RMDir "`$SMPROGRAMS\`${PRODUCT_NAME}"
              Delete "`$DESKTOP\`${PRODUCT_NAME}.lnk"
              RMDir /r "`$INSTDIR"
              DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\`${PRODUCT_NAME_EN}"
          SectionEnd
"@ | Out-File -FilePath "ci_installer.nsi" -Encoding utf8
          makensis ci_installer.nsi

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body: |
            ## 劳动法律师智能助理 ${{ env.VERSION }}

            ### 安装说明
            1. 下载 `LaborLawAssistant_Setup_${{ env.VERSION }}.exe`
            2. 双击运行安装程序
            3. 从开始菜单或桌面快捷方式启动

            ### 首次使用
            - 默认管理员: `lzy` / `123456`
            - 请确保已配置 API Key (DashScope)
          files: |
            dist/LaborLawAssistant_Setup_${{ env.VERSION }}.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
