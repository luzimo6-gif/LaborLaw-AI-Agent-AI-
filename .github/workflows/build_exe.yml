name: Build Windows EXE

# ============================================================
# 劳动法律师智能助理 — 自动化打包与发布流水线
# 
# 触发条件：
#   1. 推送到 main 分支时自动构建并上传 Artifact
#   2. 发布带 v* 标签（如 v1.0.1）时自动构建、上传 Artifact 并创建 GitHub Release
# ============================================================

on:
  push:
    branches:
      - main
    tags:
      - 'v*'           # 匹配 v1.0.0, v2.3.1 等版本标签
  # 允许手动触发
  workflow_dispatch:

jobs:
  build:
    name: Build & Package (${{ matrix.python-version }})
    runs-on: windows-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11']   # 使用 Python 3.11（NiceGUI 兼容性最佳）

    steps:
      # ── Step 1: 检出代码 ──
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取完整历史以便生成版本号

      # ── Step 2: 配置 Python 环境 ──
      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      # ── Step 3: 安装依赖 ──
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: pwsh

      # ── Step 4: 验证依赖完整性 ──
      - name: ✅ Verify Imports
        run: |
          python -c "import nicegui; print(f'NiceGUI {nicegui.__version__}')"
          python -c "import langchain; print('langchain OK')"
          python -c "import langgraph; print('langgraph OK')"
          python -c "import langchain_openai; print('langchain_openai OK')"
          python -c "import langchain_community; print('langchain_community OK')"
          python -c "import langchain_core; print('langchain_core OK')"
          python -c "import pyinstaller; print('pyinstaller OK')"
          python -c "import pydantic; print('pydantic OK')"
          python -c "import requests; print('requests OK')"
        shell: pwsh

      # ── Step 5: 生成版本号（从 Git Tag 或 Commit SHA） ──
      - name: 🏷️ Generate Version
        id: version
        run: |
          # 从 Git Tag 提取版本号，或使用 commit SHA 短号
          $ref = "${{ github.ref }}"
          if ($ref -match 'refs/tags/v(.+)$') {
            $ver = $matches[1]
          } else {
            $ver = "dev-${{ github.sha }}".Substring(0, 11)
          }
          Write-Host "Version: $ver"
          # 写入 version.txt 供打包使用
          "v$ver" | Out-File -FilePath version.txt -Encoding utf8 -NoNewline
          echo "APP_VERSION=v$ver" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # ── Step 6: PyInstaller 打包 ──
      - name: 🔨 Build with PyInstaller
        run: |
          # 获取 NiceGUI 安装路径（关键：--add-data 需要静态资源）
          $nicegui_path = (python -c "import nicegui, os; print(os.path.dirname(nicegui.__file__))").Trim()
          Write-Host "NiceGUI path: $nicegui_path"

          # 清理旧构建
          if (Test-Path "dist\AI_Labor_Law_NiceGUI") { Remove-Item -Recurse -Force "dist\AI_Labor_Law_NiceGUI" }
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }

          # PyInstaller 打包
          python -m PyInstaller `
            --name=AI_Labor_Law_NiceGUI `
            --onedir `
            --noconsole `
            --noconfirm `
            --clean `
            --add-data="data;data" `
            --add-data="vectorstore.pkl;." `
            --add-data="chunks_cache.jsonl;." `
            --add-data="users.json;." `
            --add-data="version.txt;." `
            --add-data="backend.py;." `
            --add-data="simple_vectorstore.py;." `
            --add-data="build_db.py;." `
            --add-data="convert_doc_to_docx.py;." `
            --add-data="$nicegui_path;nicegui" `
            --hidden-import=tkinter `
            --hidden-import=PIL `
            --hidden-import=PIL.Image `
            --hidden-import=langchain `
            --hidden-import=langgraph `
            --hidden-import=langchain_openai `
            --hidden-import=langchain_community `
            --hidden-import=langchain_core `
            --hidden-import=langchain_text_splitters `
            --hidden-import=simple_vectorstore `
            --hidden-import=backend `
            --hidden-import=dotenv `
            --hidden-import=reportlab `
            --hidden-import=docx `
            --hidden-import=numpy `
            --hidden-import=requests `
            --hidden-import=pymupdf `
            --hidden-import=json `
            --hidden-import=hashlib `
            --hidden-import=uuid `
            --hidden-import=re `
            --hidden-import=queue `
            --hidden-import=threading `
            --hidden-import=urllib `
            --hidden-import=tempfile `
            --hidden-import=pypdf `
            --hidden-import=nicegui `
            --hidden-import=nicegui.native `
            --hidden-import=nicegui.ui `
            --hidden-import=pywebview `
            --hidden-import=fastapi `
            --hidden-import=uvicorn `
            --hidden-import=starlette `
            --hidden-import=jinja2 `
            --hidden-import=aiofiles `
            --hidden-import=socketio `
            --hidden-import=pydantic `
            --distpath=dist `
            gui_nice.py

          if ($LASTEXITCODE -ne 0) {
            Write-Error "PyInstaller build failed!"
            exit 1
          }
          Write-Host "Build completed successfully!"
        shell: pwsh

      # ── Step 7: 验证打包产物 ──
      - name: 🔍 Verify Build Output
        run: |
          $exe_path = "dist\AI_Labor_Law_NiceGUI\AI_Labor_Law_NiceGUI.exe"
          if (Test-Path $exe_path) {
            $size = (Get-Item $exe_path).Length
            Write-Host "✅ EXE found: $exe_path ($([math]::Round($size/1MB, 2)) MB)"
          } else {
            Write-Error "❌ EXE not found!"
            Get-ChildItem -Recurse "dist" | Select-Object FullName
            exit 1
          }
        shell: pwsh

      # ── Step 8: 上传构建产物 (Artifact) ──
      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AI_Labor_Law_NiceGUI-${{ steps.version.outputs.APP_VERSION }}-windows
          path: |
            dist\AI_Labor_Law_NiceGUI\
          retention-days: 30
          compression-level: 6

      # ── Step 9: 创建 ZIP 压缩包（用于 Release） ──
      - name: 📦 Create Release ZIP
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          $version = "${{ steps.version.outputs.APP_VERSION }}"
          $zip_name = "AI_Labor_Law_NiceGUI_${version}_Windows.zip"
          Compress-Archive -Path "dist\AI_Labor_Law_NiceGUI\*" -DestinationPath $zip_name
          Write-Host "Release ZIP: $zip_name"
          echo "RELEASE_ZIP=$zip_name" >> $env:GITHUB_OUTPUT
        shell: pwsh

      # ── Step 10: 创建 GitHub Release（仅 Tag 触发） ──
      - name: 🚀 Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "劳动法律师智能助理 ${{ steps.version.outputs.APP_VERSION }}"
          body: |
            ## 🎉 劳动法律师智能助理 ${{ steps.version.outputs.APP_VERSION }}

            ### 📦 下载说明
            - 下载下方 `AI_Labor_Law_NiceGUI_*.zip` 压缩包
            - 解压后双击 `AI_Labor_Law_NiceGUI.exe` 即可运行
            - 首次运行可能需要配置 API Key（阿里云百炼 / DeepSeek / 硅基流动）

            ### 🔧 系统要求
            - Windows 10 / 11 x64
            - 无需安装 Python 或其他依赖

            ### 📝 更新内容
            请查看 [CHANGELOG](https://github.com/${{ github.repository }}/compare) 了解详细变更。
          files: |
            AI_Labor_Law_NiceGUI_${{ steps.version.outputs.APP_VERSION }}_Windows.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
